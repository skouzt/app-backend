name: CI

# Three production failures reached deploy because everything was only ever run in
# the dev venv: a COPY of a directory that had been deleted, a dependency missing
# from requirements.txt but present transitively in the venv, and an .env value
# Docker parses differently to python-dotenv. None of them are visible without
# building a clean image and starting it, so that is what this does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Fails in a second with a clear message, rather than after a multi-minute
      # image build with "failed to compute cache key: /schemas: not found".
      - name: Every Dockerfile COPY source exists
        run: |
          status=0
          while read -r _ src _; do
            [ -e "$src" ] || { echo "::error file=Dockerfile::COPY source '$src' does not exist"; status=1; }
          done < <(grep -E '^COPY ' Dockerfile)
          [ $status -eq 0 ] && echo "all COPY sources present"
          exit $status

      - name: No inline comments in .env.example
        # Docker's --env-file keeps everything after '=' verbatim, so
        # `KEY=value # note` becomes part of the value.
        run: |
          if [ -f .env.example ] && grep -nE '^[A-Z_][A-Z0-9_]*=.*[^ ] +#' .env.example; then
            echo "::error::inline comment in .env.example — put it on its own line"
            exit 1
          fi
          echo "no inline comments"

      - name: Install and lint
        run: |
          pip install --quiet -r requirements.txt pyflakes
          pyflakes api core db services prompts config main.py

      - name: Price catalogue is valid
        # Catches the decimal-place class of error: a zero-decimal currency written
        # as if it had cents is a 100x overcharge that looks like a normal integer.
        run: python scripts/validate_catalog.py

      - name: Pins match what actually installs
        run: |
          python - <<'PY'
          import re, subprocess, sys
          req = {}
          for line in open("requirements.txt"):
              s = line.strip()
              if not s or s.startswith("#"):
                  continue
              if "==" not in s:
                  print(f"::error::{s} is not pinned"); sys.exit(1)
              n, v = s.split("==")
              req[re.sub(r"\[.*\]", "", n).lower().replace("_", "-")] = v
          have = {}
          for l in subprocess.run([sys.executable, "-m", "pip", "freeze"],
                                  capture_output=True, text=True).stdout.splitlines():
              if "==" in l:
                  n, v = l.split("==")
                  have[n.lower().replace("_", "-")] = v
          bad = [f"{k}: pinned {v}, installed {have[k]}"
                 for k, v in req.items() if k in have and have[k] != v]
          for b in bad:
              print(f"::error::{b}")
          sys.exit(1 if bad else 0)
          PY

  image:
    name: Image builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t lily-api:ci .

      # Dummy credentials are enough: the Supabase client connects lazily, and the
      # Clerk issuer is a public JWKS URL. Nothing here needs a repository secret,
      # so this runs on pull requests from forks too.
      - name: Boot and import every module
        env:
          CLERK_JWT_ISSUER: https://clerk.aletheia-ai.space
          CLERK_JWT_AUDIENCE: backend-api
        run: |
          docker run --rm \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=dummy \
            -e CLERK_JWT_ISSUER="$CLERK_JWT_ISSUER" \
            -e CLERK_JWT_AUDIENCE="$CLERK_JWT_AUDIENCE" \
            -e DODO_ENVIRONMENT=test_mode \
            -e RUN_REAPER=false \
            lily-api:ci python - <<'PY'
          import importlib, pkgutil, sys
          import main
          from fastapi.routing import APIRoute

          # Walking every module is what catches a dependency that is missing from
          # requirements.txt but present in a developer's venv.
          bad = []
          for pkg in ("api", "core", "db", "services", "prompts", "config"):
              for m in pkgutil.walk_packages([f"/app/{pkg}"], prefix=f"{pkg}."):
                  try:
                      importlib.import_module(m.name)
                  except Exception as e:
                      bad.append(f"{m.name}: {type(e).__name__}: {e}")
          for b in bad:
              print(f"::error::{b}")

          routes = [r for r in main.app.routes if isinstance(r, APIRoute)]
          print(f"{len(routes)} routes registered")
          if len(routes) < 20:
              print(f"::error::only {len(routes)} routes — a router failed to register")
              bad.append("routes")
          sys.exit(1 if bad else 0)
          PY

      - name: Serve traffic
        env:
          CLERK_JWT_ISSUER: https://clerk.aletheia-ai.space
          CLERK_JWT_AUDIENCE: backend-api
        run: |
          cid=$(docker run -d -p 8080:8080 \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_SERVICE_ROLE_KEY=dummy \
            -e CLERK_JWT_ISSUER="$CLERK_JWT_ISSUER" \
            -e CLERK_JWT_AUDIENCE="$CLERK_JWT_AUDIENCE" \
            -e DODO_ENVIRONMENT=test_mode \
            -e RUN_REAPER=false \
            lily-api:ci)
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8080/health)" = "200" ] && break
            sleep 2
          done

          health=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8080/health)
          [ "$health" = "200" ] || { echo "::error::/health returned $health"; exit 1; }

          # An unauthenticated call must never reach a handler.
          auth=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8080/api/v1/chat/messages)
          case "$auth" in
            401|403|422) ;;
            *) echo "::error::unauthenticated request returned $auth — auth is not enforced"; exit 1 ;;
          esac

          # Removed during the security pass; it should not come back.
          dbg=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8080/debug/routes)
          [ "$dbg" = "404" ] || { echo "::error::/debug/routes returned $dbg — it should be gone"; exit 1; }

          echo "health=$health  unauth=$auth  debug=$dbg"
